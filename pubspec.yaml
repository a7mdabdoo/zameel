name: zameel
description: "زَميل - منصة التعلّم التشاركي وتنظيم المذاكرة الذكية لطلاب الحاسبات"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  flutter_local_notifications: ^22.3.3
  intl: ^0.20.3
  timezone: ^0.11.2

  material_ui: any
  cupertino_ui: any
  image_picker: ^1.2.4
  firebase_storage: ^14.1.0
  url_launcher: ^6.3.3
  shared_preferences: ^2.5.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  fake_cloud_firestore: ^4.5.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/
    - assets/brand/

  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/brand/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "assets/brand/icon_background.png"
  adaptive_icon_foreground: "assets/brand/icon_foreground.png"
  adaptive_icon_monochrome: "assets/brand/icon_monochrome.png"

flutter_native_splash:
  color: "#F8FAFC"
  color_dark: "#0B131E"
  image: "assets/brand/icon_foreground.png"
  image_dark: "assets/brand/icon_foreground.png"
  android_12:
    color: "#F8FAFC"
    color_dark: "#0B131E"
    image: "assets/brand/icon_foreground.png"
    image_dark: "assets/brand/icon_foreground.png"
